; Engineering builds. Not bench-tested and not a turnkey cutting configuration.
[platformio]
include_dir = Inc
src_dir = Src
extra_configs = platformio.ini
default_envs = kraken_v11_hybrid

[kraken_common]
build_flags = ${common.build_flags}
              ${usb_h723.build_flags}
  -D BOARD_MY_MACHINE
  -D HSE_VALUE=25000000
  -D N_AXIS=3
  -D Y_GANGED=1
  -D Y_AUTO_SQUARE=1
  -D TRINAMIC_ENABLE=5160
  -D TRINAMIC_DEFAULT_MICROSTEPS=16
  -D TMC_STEALTHCHOP=0
  -D TMC_X_CURRENT=500
  -D TMC_Y_CURRENT=500
  -D TMC_Z_CURRENT=500
  -D SAFETY_DOOR_ENABLE=1
  -D ESTOP_ENABLE=1
  -D PROBE_ENABLE=1
  -D COOLANT_ENABLE=0
  -D DEFAULT_X_STEPS_PER_MM=320.0f
  -D DEFAULT_Y_STEPS_PER_MM=320.0f
  -D DEFAULT_Z_STEPS_PER_MM=640.0f
  -D DEFAULT_X_MAX_TRAVEL=800.0f
  -D DEFAULT_Y_MAX_TRAVEL=1000.0f
  -D DEFAULT_Z_MAX_TRAVEL=100.0f
  -D DEFAULT_X_MAX_RATE=600.0f
  -D DEFAULT_Y_MAX_RATE=600.0f
  -D DEFAULT_Z_MAX_RATE=300.0f
  -D DEFAULT_X_ACCELERATION=20.0f
  -D DEFAULT_Y_ACCELERATION=20.0f
  -D DEFAULT_Z_ACCELERATION=10.0f
  -D DEFAULT_DUAL_AXIS_HOMING_FAIL_DISTANCE_MAX=2.5f
  -D DEFAULT_DUAL_AXIS_HOMING_FAIL_DISTANCE_MIN=2.5f
  -D DEFAULT_DUAL_AXIS_HOMING_FAIL_AXIS_LENGTH_PERCENT=0.25f
lib_deps = ${common_h723.lib_deps}
           ${usb_h723.lib_deps}
           motors
           trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
                 ${usb_h723.lib_extra_dirs}

[env:kraken_v11_router]
platform = ststm32@20.0.0
board = generic_stm32h723zg
board_build.ldscript = STM32H723VGTX_BL_FLASH.ld
build_flags = ${kraken_common.build_flags}
  -D SPINDLE0_ENABLE=SPINDLE_PWM0_NODIR
  -D DEFAULT_SPINDLE_RPM_MAX=24000.0f
  -D DEFAULT_SPINDLE_PWM_FREQ=5000
lib_deps = ${kraken_common.lib_deps}
lib_extra_dirs = ${kraken_common.lib_extra_dirs}

[env:kraken_v11_plasma]
platform = ststm32@20.0.0
board = generic_stm32h723zg
board_build.ldscript = STM32H723VGTX_BL_FLASH.ld
build_flags = ${kraken_common.build_flags}
  -D SPINDLE0_ENABLE=SPINDLE_ONOFF0
  -D PLASMA_ENABLE=1
lib_deps = ${kraken_common.lib_deps}
           plasma
lib_extra_dirs = ${kraken_common.lib_extra_dirs}

; One image, two cold-start profiles: $350=0 router, $350=2 external THC.
; Set mode only with tool power inhibited, save it, then reset the controller.
; The physical mode selector must independently gate the selected tool.
[env:kraken_v11_hybrid]
platform = ststm32@20.0.0
board = generic_stm32h723zg
board_build.ldscript = STM32H723VGTX_BL_FLASH.ld
build_flags = ${kraken_common.build_flags}
  -D SPINDLE0_ENABLE=SPINDLE_PWM0_NODIR
  -D DEFAULT_SPINDLE_RPM_MAX=24000.0f
  -D DEFAULT_SPINDLE_PWM_FREQ=5000
  -D PLASMA_ENABLE=1
lib_deps = ${kraken_common.lib_deps}
           plasma
lib_extra_dirs = ${kraken_common.lib_extra_dirs}
